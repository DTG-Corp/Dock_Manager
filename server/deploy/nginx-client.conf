# Phục vụ SPA client (React/Vite) cho stack local-5080, proxy /api -> app:8080 (kèm WebSocket).
# Dùng bởi service `web` trong docker-compose.local-5080.yml.
# File này nằm trong /etc/nginx/conf.d/ (được include trong block `http`) nên `map` ở đây hợp lệ.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # upstream động: nginx vẫn start khi container app chưa sẵn sàng
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;
    listen 80;
    server_name _;

    # Bản build của client: server/deploy -> ../../client/dist (mount ro trong compose)
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: mọi route không phải file thật -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket (live preview) -> FastAPI
    location /api/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host (không phải $host) để giữ cả cổng: FastAPI trả 307 kèm Location dựng từ Host,
        # thiếu cổng thì trình duyệt bị đẩy sang http://<host>/... (cổng 80) và UI hỏng.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # healthcheck đơn giản
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
